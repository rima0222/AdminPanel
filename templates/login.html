<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f0c29; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Tahoma; }
        .login-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; text-align: center; }
        .form-control:focus { background: rgba(255,255,255,0.2); color: white; box-shadow: none; border-color: #00d2ff; }
        .btn-primary { background: linear-gradient(45deg, #00d2ff, #3a7bd5); border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card text-center text-white">
        <h3 class="mb-4">🚀 ورود به سیستم</h3>
        <form method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="نام کاربری" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="رمز عبور" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">ورود به پنل</button>
        </form>
        <p class="mt-4 small text-muted">Smart SSH-PRO v4.0</p>
    </div>
</body>
</html>
