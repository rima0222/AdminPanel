<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل هوشمند</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f0c29; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; font-family: Tahoma; }
        .login-card { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 400px; }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; }
        .form-control:focus { background: rgba(255,255,255,0.2); color: white; }
        .btn-primary { background: linear-gradient(45deg, #00d2ff, #3a7bd5); border: none; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h3 class="mb-4">🚀 ورود به مدیریت</h3>
        <form method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control text-center" placeholder="نام کاربری" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control text-center" placeholder="رمز عبور" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">ورود به پنل</button>
        </form>
        <p class="mt-3 small text-muted">Smart SSH-PRO v2.0</p>
    </div>
</body>
</html>
