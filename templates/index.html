<table class="table table-dark">
    <thead>
        <tr>
            <th>کاربر</th>
            <th>اعتبار</th>
            <th>حجم باقی‌مانده</th> <th>پروتکل</th>
            <th>وضعیت</th>
            <th>عملیات</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.username }}</td>
            <td><span class="badge bg-primary">{{ u.days_left }} روز</span></td>
            <td><span class="badge bg-info">{{ u.rem_traffic }}</span></td>
            <td>{{ u.protocol }}</td>
            <td>{{ '🟢 آنلاین' if u.username in online else '⚪ آفلاین' }}</td>
            <td>
                <a href="/download_npv/{{ u.username }}" class="btn btn-sm btn-success">📥 دریافت NPV</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
