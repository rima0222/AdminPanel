<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smart SSH-PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0f0c29;color:white;font-family:Tahoma}.card{background:rgba(255,255,255,0.05);border:none;margin-bottom:20px}.badge{font-size: 0.9em;}</style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h3>🚀 داشبورد مدیریت SSH-PRO</h3>
        <div>
            <a href="/backup" class="btn btn-outline-info btn-sm">💾 دانلود بک‌آپ</a>
            <a href="/logout" class="btn btn-danger btn-sm">خروج</a>
        </div>
    </div>

    <div class="card p-4">
        <form action="/add" method="post" class="row g-3">
            <div class="col-md-2"><input type="text" name="username" class="form-control" placeholder="نام کاربری" required></div>
            <div class="col-md-2"><input type="text" name="password" class="form-control" placeholder="رمز" required></div>
            <div class="col-md-3"><input type="email" name="user_email" class="form-control" placeholder="ایمیل (اختیاری)"></div>
            <div class="col-md-2">
                <select name="protocol" class="form-select">
                    <option value="SSH">SSH ساده</option>
                    <option value="WS">WebSocket</option>
                    <option value="Pro">SSH Pro</option>
                </select>
            </div>
            <div class="col-md-1"><input type="number" name="limit_login" class="form-control" value="1" title="تعداد کاربر"></div>
            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">ساخت اکانت</button></div>
        </form>
    </div>

    <div class="card p-3">
        <h6>📤 بازگردانی دیتابیس (users.db)</h6>
        <form action="/restore" method="post" enctype="multipart/form-data" class="d-flex">
            <input type="file" name="file" class="form-control me-2">
            <button type="submit" class="btn btn-warning">Restore</button>
        </form>
    </div>

    <table class="table table-dark table-striped">
        <thead>
            <tr><th>نام</th><th>اعتبار</th><th>حجم باقی‌مانده</th><th>پروتکل</th><th>وضعیت</th><th>عملیات</th></tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.username }}</td>
                <td><span class="badge bg-primary">{{ u.days_left }} روز</span></td>
                <td><span class="badge bg-info text-dark">{{ u.rem_traffic }}</span></td>
                <td>{{ u.protocol }}</td>
                <td>{{ '🟢 آنلاین' if u.username in online else '⚪ آفلاین' }}</td>
                <td>
                    <a href="/download_npv/{{ u.username }}" class="btn btn-sm btn-success">📥 NPV</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
