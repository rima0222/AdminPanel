<body class="container py-4">
    <div class="row text-center mb-4">
        <div class="col-md-6"><div class="card p-3">CPU Usage: <b id="cpu">0</b>%</div></div>
        <div class="col-md-6"><div class="card p-3">RAM Usage: <b id="ram">0</b>%</div></div>
    </div>
    
    <div id="user_list">
        </div>

    <script>
        function refresh() {
            $.get('/api/users', function(data) {
                let html = '<table class="table table-dark"><thead><tr><th>User</th><th>Days</th><th>Traffic</th><th>Status</th><th>Action</th></tr></thead><tbody>';
                data.forEach(u => {
                    let badge = u.online ? 'success' : 'secondary';
                    html += `<tr><td>${u.username}</td><td>${u.days}</td><td>${u.traffic}/40 GB</td><td><span class="badge bg-${badge}">${u.online?'Online':'Offline'}</span></td><td><a href="/download_npvt/${u.username}" class="btn btn-sm btn-info">NPVT</a> <a href="/delete/${u.id}" class="btn btn-sm btn-danger">Delete</a></td></tr>`;
                });
                html += '</tbody></table>';
                $('#user_list').html(html);
            });
            $.get('/system_info', function(d){ $('#cpu').text(d.cpu); $('#ram').text(d.ram); });
        }
        setInterval(refresh, 10000); refresh();
    </script>
</body>
