<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SSH-PRO Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f0c29; color: white; font-family: Tahoma; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; }
        .btn-primary { background: #24243e; border: 1px solid #00d2ff; }
    </style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h4>🚀 داشبورد مدیریت</h4>
        <div>
            <button class="btn btn-sm btn-outline-warning" data-bs-toggle="collapse" data-bs-target="#adminBox">⚙️ تنظیمات ادمین</button>
            <a href="/logout" class="btn btn-sm btn-danger">🚪 خروج</a>
        </div>
    </div>

    <div id="adminBox" class="collapse card p-3 mb-4 text-dark bg-light">
        <form action="/change_admin" method="post" class="row g-2">
            <div class="col-md-5"><input type="text" name="new_user" class="form-control" placeholder="یوزر جدید ادمین"></div>
            <div class="col-md-5"><input type="text" name="new_pwd" class="form-control" placeholder="رمز جدید ادمین"></div>
            <div class="col-md-2"><button type="submit" class="btn btn-dark w-100">بروزرسانی</button></div>
        </form>
    </div>

    <div class="card p-4 mb-4">
        <h5>افزودن کاربر جدید</h5>
        <form action="/add" method="post" class="row g-3">
            <div class="col-md-3"><input type="text" name="username" class="form-control" placeholder="نام کاربری" required></div>
            <div class="col-md-3"><input type="text" name="password" class="form-control" placeholder="رمز عبور" required></div>
            <div class="col-md-3">
                <select name="protocol" class="form-select">
                    <option value="Direct SSH">Direct SSH</option>
                    <option value="WebSocket">WebSocket</option>
                </select>
            </div>
            <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">ساخت اکانت</button></div>
        </form>
    </div>

    <div class="card p-4">
        <table class="table table-dark">
            <thead><tr><th>نام کاربری</th><th>پروتکل</th><th>وضعیت</th><th>عملیات</th></tr></thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.protocol }}</td>
                    <td>{{ '🟢 آنلاین' if user.username in online else '🔴 آفلاین' }}</td>
                    <td><a href="/delete/{{ user.username }}" class="btn btn-danger btn-sm">حذف</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
