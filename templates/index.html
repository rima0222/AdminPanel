<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل هوشمند</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: Tahoma; }
        .card { background: #1e1e1e; border: none; border-radius: 12px; margin-top: 20px; }
        .online { color: #00e676; } .offline { color: #ff5252; }
    </style>
</head>
<body class="container py-5">
    <h2 class="text-center mb-4">🚀 مدیریت پنل هوشمند</h2>
    <div class="card p-4">
        <p>مصرف پردازنده: {{ cpu }}%</p>
        <table class="table table-dark">
            <thead>
                <tr>
                    <th>کاربر</th> <th>وضعیت</th> <th>تاریخ انقضا</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td class="{{ 'online' if user.username in online else 'offline' }}">
                        {{ 'آنلاین' if user.username in online else 'آفلاین' }}
                    </td>
                    <td>{{ user.exp_date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
