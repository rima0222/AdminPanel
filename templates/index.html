<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smart Panel Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>body{background:#0a0a1a;color:white;font-family:Tahoma}.status-card{background:#16162d;border-radius:10px;padding:15px;margin-bottom:20px}</style>
</head>
<body class="container py-4">
    <div class="row text-center mb-4">
        <div class="col-md-3"><div class="status-card">CPU: <span id="cpu_usage">0</span>%</div></div>
        <div class="col-md-3"><div class="status-card">RAM: <span id="ram_usage">0</span>%</div></div>
    </div>

    <table class="table table-dark">
        <thead>
            <tr><th>کاربر</th><th>اعتبار</th><th>مصرف (GB)</th><th>وضعیت</th><th>عملیات</th></tr>
        </thead>
        <tbody id="user_table"></tbody>
    </table>

    <script>
        function updateData() {
            $.get('/api/users', function(data) {
                $('#user_table').empty();
                data.forEach(function(u) {
                    let status = u.online ? '<span class="badge bg-success">آنلاین</span>' : '<span class="badge bg-secondary">آفلاین</span>';
                    $('#user_table').append(`<tr>
                        <td>${u.username}</td>
                        <td>${u.days} روز</td>
                        <td>${u.traffic} / 40</td>
                        <td>${status}</td>
                        <td>
                            <a href="/download_npvt/${u.username}" class="btn btn-sm btn-info">📥</a>
                            <a href="/delete/${u.id}" class="btn btn-sm btn-danger" onclick="return confirm('حذف شود؟')">🗑️</a>
                        </td>
                    </tr>`);
                });
            });
            $.get('/system_info', function(data) {
                $('#cpu_usage').text(data.cpu); $('#ram_usage').text(data.ram);
            });
        }
        setInterval(updateData, 5000); // بروزرسانی هر ۵ ثانیه
        updateData();
    </script>
</body>
</html>
